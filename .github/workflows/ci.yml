name: ci
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt, vet, tests, build, every action through cmd/try
        run: make check
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest
      - name: shellcheck
        run: shellcheck actions/*/*.sh
