version: "2"
linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - revive
  settings:
    misspell:
      locale: US
    revive:
      rules:
        - name: exported
          disabled: true
  exclusions:
    # defer f.Close(), fmt.Fprint* and the like: their errors are not worth a branch.
    presets:
      - std-error-handling
formatters:
  enable:
    - gofmt
